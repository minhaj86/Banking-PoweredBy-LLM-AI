spring:
  profiles:
    default: local
  application:
    name: finance-ledger-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger_app}
    password: ${DB_PASSWORD:dev-app-only}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: "SET TIME ZONE 'UTC'"
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    user: ${MIGRATION_DB_USER:ledger_migrator}
    password: ${MIGRATION_DB_PASSWORD:dev-migration-only}
    default-schema: ledger
    schemas: ledger
    placeholders:
      runtimeRole: ${DB_USER:ledger_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
logging:
  structured:
    format:
      console: logstash
