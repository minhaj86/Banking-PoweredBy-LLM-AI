# Same canonical gateway origin and IAM callbacks while Vite supplies application modules/HMR.
location / {
  proxy_pass http://web-dev:5173;
  proxy_http_version 1.1;
  proxy_set_header Host localhost:18082;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  include /etc/nginx/dev-security-headers.conf;
  add_header Cache-Control no-store always;
}
