resolver 127.0.0.11 valid=5s ipv6=off;
upstream bff_cluster { zone bff_nodes 64k; server bff-a:8082 resolve; server bff-b:8082 resolve; keepalive 32; }
server {
  listen 8080;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  client_max_body_size 11m;
  include /etc/nginx/security-headers.conf;
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
  location ~ ^/(bff|oauth2|login|logout)/ {
    proxy_pass http://bff_cluster;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host localhost:18082;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 45s;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control no-store always;
  }
  location /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_set_header Host localhost:18082;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    add_header Cache-Control no-store always;
  }
  include /etc/nginx/loan-spa.conf;
}
