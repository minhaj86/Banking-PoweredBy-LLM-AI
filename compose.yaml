# Preserve the original default for existing .env files and their volumes.
# New local initialization writes COMPOSE_PROJECT_NAME=placeholder-bank.
name: finance-loan-origination
services:
  ledger-db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger_bootstrap
      POSTGRES_PASSWORD: ${LEDGER_BOOTSTRAP_PASSWORD:?Run loan-service/scripts/init-local.ps1 or init-local.sh first}
      LEDGER_MIGRATION_PASSWORD: ${LEDGER_MIGRATION_PASSWORD}
      LEDGER_APP_PASSWORD: ${LEDGER_DB_PASSWORD}
    volumes:
      - loan-demo-ledger-data:/var/lib/postgresql/data
      - ./ledger-core/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-ledger.sh:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ledger_bootstrap -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 30
  ledger:
    build:
      context: .
      dockerfile: ledger-core/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://ledger-db:5432/ledger
      SPRING_PROFILES_ACTIVE: local
      DB_USER: ledger_app
      DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      MIGRATION_DB_USER: ledger_migrator
      MIGRATION_DB_PASSWORD: ${LEDGER_MIGRATION_PASSWORD}
    depends_on:
      ledger-db:
        condition: service_healthy
    ports: ["127.0.0.1:${LOAN_DEMO_LEDGER_PORT:-18080}:8080"]
  ledger-bootstrap:
    image: curlimages/curl:8.12.1
    user: "0:0"
    volumes: [loan-demo-config:/config]
    depends_on:
      ledger:
        condition: service_healthy
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        if [ -s /config/ledger.properties ]; then
          id=$$(cut -d= -f2 /config/ledger.properties)
          curl -fsS http://ledger:8080/api/v1/ledgers/$$id >/dev/null
        else
          body=$$(curl -fsS -H 'Content-Type: application/json' -d '{"code":"LOAN-DEMO-SEK","name":"Synthetic loan demo","currency":"SEK"}' http://ledger:8080/api/v1/ledgers)
          id=$$(printf '%s' "$$body" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p')
          test -n "$$id"
          printf 'loan.ledger.id=%s\n' "$$id" >/config/ledger.properties
          chmod 644 /config/ledger.properties
        fi
  loan-db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: loans
      POSTGRES_USER: loan_bootstrap
      POSTGRES_PASSWORD: ${LOAN_BOOTSTRAP_PASSWORD}
      LOAN_MIGRATION_PASSWORD: ${LOAN_MIGRATION_PASSWORD}
      LOAN_DB_PASSWORD: ${LOAN_DB_PASSWORD}
    volumes:
      - loan-demo-data:/var/lib/postgresql/data
      - ./loan-service/docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-loans.sh:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U loan_bootstrap -d loans"]
      interval: 3s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:3.85
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - loan-demo-objects:/data
      - ./scripts/container-health.sh:/opt/bank/container-health.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/opt/bank/container-health.sh", "storage"]
      interval: 5s
      timeout: 6s
      start_period: 15s
      retries: 30
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        umask 077
        printf '{"identities":[{"name":"loan-service","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/tmp/s3.json
        exec weed server -s3 -s3.port=8333 -s3.config=/tmp/s3.json -dir=/data -ip=storage -master.volumeSizeLimitMB=100 -volume.max=10
  storage-bootstrap:
    image: amazon/aws-cli:2.27.0
    depends_on: {storage: {condition: service_healthy}}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh","-ec"]
    command:
      - |
        for attempt in $$(seq 1 60); do
          if aws --endpoint-url http://storage:8333 s3api head-bucket --bucket loan-evidence >/dev/null 2>&1; then exit 0; fi
          if aws --endpoint-url http://storage:8333 s3api create-bucket --bucket loan-evidence >/dev/null 2>&1; then exit 0; fi
          sleep 1
        done
        exit 1
  clamav:
    image: clamav/clamav:1.4.3
    volumes: [loan-demo-clamav:/var/lib/clamav]
    healthcheck:
      test: ["CMD","clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
  loans:
    build:
      context: .
      dockerfile: loan-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_CONFIG_IMPORT: file:/run/loan/ledger.properties
      LOAN_DB_URL: jdbc:postgresql://loan-db:5432/loans
      LOAN_DB_USER: loan_app
      LOAN_DB_PASSWORD: ${LOAN_DB_PASSWORD}
      LOAN_MIGRATION_USER: loan_migrator
      LOAN_MIGRATION_PASSWORD: ${LOAN_MIGRATION_PASSWORD}
      LOAN_ENCRYPTION_KEY: ${LOAN_ENCRYPTION_KEY}
      LOAN_LOCAL_JWT_SECRET: ${LOAN_LOCAL_JWT_SECRET}
      S3_ENDPOINT: http://storage:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      LEDGER_URL: http://ledger:8080
      CLAMAV_HOST: clamav
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_MODEL: ${AI_MODEL:-}
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_DATA_HANDLING_APPROVED: ${AI_DATA_HANDLING_APPROVED:-false}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70.0"
    volumes: [loan-demo-config:/run/loan:ro]
    depends_on:
      ledger-bootstrap: {condition: service_completed_successfully}
      storage-bootstrap: {condition: service_completed_successfully}
      loan-db: {condition: service_healthy}
      clamav: {condition: service_healthy}
    ports: ["127.0.0.1:${LOAN_DEMO_PORT:-18081}:8081"]
volumes:
  loan-demo-ledger-data:
  loan-demo-data:
  loan-demo-objects:
  loan-demo-config:
  loan-demo-clamav:

